name: agb_left_wing_books
description: Perpustakaan pemikiran kiri - AGB Left-Wing Books.
publish_to: 'none'
version: 0.3.5+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/buku/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/ikon_512.png"
  adaptive_icon_background: "#00529C"
  adaptive_icon_foreground: "assets/logo/ikon_foreground.png"
  min_sdk_android: 21
