name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Buka ZIP otomatis (kalau ada)
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -n "$Z" ]; then
            unzip -o "$Z" -x '.github/*' 'ALUR_KERJA_*' 'BACA_DULU.txt'
            git rm -q --cached "$Z"
            rm -f "$Z"
            git config user.name github-actions
            git config user.email actions@github.com
            git add -A
            git commit -m "Buka ZIP: $Z" || true
            git push
          fi

      - name: Pasang Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder Android
        run: |
          cp -r lib /tmp/lib_cadangan
          cp pubspec.yaml /tmp/pubspec_cadangan.yaml
          flutter create . --platforms=android --org id.agb --project-name agb_left_wing_books
          rm -rf lib
          cp -r /tmp/lib_cadangan lib
          cp /tmp/pubspec_cadangan.yaml pubspec.yaml
          rm -rf test

      - name: Pasang pdftotext
        run: which pdftotext || sudo apt-get install -y poppler-utils

      - name: Unduh isi buku
        continue-on-error: true
        run: python3 tool/unduh_buku.py

      - name: Atur nama aplikasi dan izin internet
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="AGB Left-Wing Books"/' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M

      - name: Ambil paket
        run: flutter pub get

      - name: Buat ikon aplikasi
        run: dart run flutter_launcher_icons

      - name: Bangun APK
        run: flutter build apk --release

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: AGB-Left-Wing-Books-v0.3.4
          path: build/app/outputs/flutter-apk/app-release.apk
